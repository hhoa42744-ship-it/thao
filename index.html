<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gửi Thảo ❤️ - 20/10 Đặc Biệt</title>
    <link href="https://fonts.googleapis.com/css2?family=Dancing+Script:wght@600;700&family=Great+Vibes&family=Quicksand:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            min-height: 100vh;
            background: radial-gradient(circle at center, #2e082d 0%, #12031a 60%, #05000a 100%);
            font-family: 'Quicksand', sans-serif;
            color: #fff;
            overflow-x: hidden;
            display: flex;
            justify-content: center;
            align-items: center;
            position: relative;
        }

        canvas {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 1;
        }

        /* Music Control */
        .music-btn {
            position: fixed;
            top: 25px;
            right: 25px;
            z-index: 100;
            background: rgba(255, 255, 255, 0.12);
            backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.3);
            border-radius: 50%;
            width: 50px;
            height: 50px;
            display: flex;
            justify-content: center;
            align-items: center;
            cursor: pointer;
            font-size: 22px;
            transition: all 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            box-shadow: 0 8px 32px 0 rgba(255, 105, 180, 0.25);
        }

        .music-btn:hover {
            transform: scale(1.15) rotate(15deg);
            background: rgba(255, 105, 180, 0.35);
            border-color: rgba(255, 182, 193, 0.8);
        }

        /* 3D Envelope Intro */
        .envelope-container {
            position: relative;
            z-index: 10;
            perspective: 1000px;
            cursor: pointer;
            text-align: center;
            transition: all 0.5s ease;
        }

        .envelope-container:hover .envelope {
            transform: rotateX(10deg) rotateY(-5deg) scale(1.03);
            box-shadow: 0 25px 50px rgba(255, 20, 147, 0.4);
        }

        .envelope {
            width: 320px;
            height: 220px;
            background: linear-gradient(135deg, #ff2a6d 0%, #910048 100%);
            border-radius: 16px;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.6), 0 0 30px rgba(255, 42, 109, 0.3);
            position: relative;
            display: flex;
            justify-content: center;
            align-items: center;
            margin: 0 auto;
            transition: all 0.5s ease;
            border: 1px solid rgba(255, 255, 255, 0.2);
        }

        .envelope-flap {
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 110px;
            background: linear-gradient(135deg, #ff416c, #e00052);
            clip-path: polygon(0 0, 100% 0, 50% 100%);
            transform-origin: top;
            transition: transform 0.6s ease;
        }

        .seal {
            width: 65px;
            height: 65px;
            background: radial-gradient(circle, #ffe600 0%, #ff8800 100%);
            border-radius: 50%;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 30px;
            box-shadow: 0 0 25px rgba(255, 215, 0, 0.8), inset 0 0 10px rgba(255, 255, 255, 0.6);
            z-index: 2;
            animation: pulse 1.8s infinite;
        }

        @keyframes pulse {
            0% { transform: scale(1); box-shadow: 0 0 0 0 rgba(255, 215, 0, 0.8); }
            70% { transform: scale(1.1); box-shadow: 0 0 0 18px rgba(255, 215, 0, 0); }
            100% { transform: scale(1); box-shadow: 0 0 0 0 rgba(255, 215, 0, 0); }
        }

        .envelope-hint {
            margin-top: 30px;
            font-family: 'Dancing Script', cursive;
            font-size: 2.3rem;
            color: #ffd1dc;
            text-shadow: 0 0 12px rgba(255, 182, 193, 0.9);
            animation: bounce 2s infinite;
        }

        @keyframes bounce {
            0%, 20%, 50%, 80%, 100% { transform: translateY(0); }
            40% { transform: translateY(-10px); }
            60% { transform: translateY(-5px); }
        }

        /* Luxury Card Main Container */
        .card-container {
            position: relative;
            z-index: 10;
            width: 92%;
            max-width: 680px;
            background: rgba(255, 255, 255, 0.07);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.25);
            border-radius: 28px;
            padding: 45px 35px;
            box-shadow: 0 30px 60px rgba(0, 0, 0, 0.6), inset 0 0 20px rgba(255, 255, 255, 0.1);
            text-align: center;
            display: none;
            opacity: 0;
            transform: scale(0.9) translateY(40px);
            transition: all 0.8s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }

        .card-container.active {
            display: block;
            opacity: 1;
            transform: scale(1) translateY(0);
        }

        .badge-2010 {
            display: inline-block;
            padding: 6px 20px;
            background: linear-gradient(90deg, #ff416c, #ff4b2b);
            border-radius: 50px;
            font-size: 0.85rem;
            font-weight: 700;
            letter-spacing: 3px;
            text-transform: uppercase;
            margin-bottom: 15px;
            box-shadow: 0 4px 15px rgba(255, 65, 108, 0.4);
        }

        .header-title {
            font-family: 'Great Vibes', cursive;
            font-size: 3.5rem;
            background: linear-gradient(45deg, #ff9a9e, #fecfef, #fecfe0, #ffdde1);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin-bottom: 5px;
            text-shadow: 0 0 20px rgba(255, 154, 158, 0.3);
        }

        .recipient-name {
            font-family: 'Dancing Script', cursive;
            font-size: 3rem;
            color: #ffd700;
            font-weight: 700;
            margin-bottom: 25px;
            text-shadow: 0 0 20px rgba(255, 215, 0, 0.6), 0 0 40px rgba(255, 215, 0, 0.3);
        }

        .message-box {
            font-size: 1.15rem;
            line-height: 1.9;
            color: #fff0f5;
            min-height: 180px;
            margin-bottom: 25px;
            text-align: left;
            background: rgba(0, 0, 0, 0.18);
            border-radius: 16px;
            padding: 22px;
            border: 1px solid rgba(255, 255, 255, 0.1);
        }

        .cursor {
            display: inline-block;
            width: 3px;
            height: 1.2em;
            background-color: #ff416c;
            vertical-align: middle;
            margin-left: 2px;
            animation: blink 0.7s infinite;
        }

        @keyframes blink {
            0%, 100% { opacity: 1; }
            50% { opacity: 0; }
        }

        /* Chữ ký "Châm xinh ngoan iu thân gửi" */
        .signature-section {
            margin-top: 15px;
            margin-bottom: 25px;
            text-align: right;
            padding-right: 15px;
            opacity: 0;
            transform: translateY(15px);
            transition: all 1s ease 0.3s;
        }

        .signature-section.show {
            opacity: 1;
            transform: translateY(0);
        }

        .signature-text {
            font-family: 'Great Vibes', cursive;
            font-size: 2.3rem;
            background: linear-gradient(45deg, #ffd700, #ff80ab, #00ffff);
            background-size: 200% auto;
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            animation: shine 4s linear infinite;
            display: inline-block;
            filter: drop-shadow(0 0 8px rgba(255, 215, 0, 0.4));
        }

        @keyframes shine {
            to { background-position: 200% center; }
        }

        .btn-group {
            display: flex;
            gap: 12px;
            justify-content: center;
            flex-wrap: wrap;
        }

        .action-btn {
            background: linear-gradient(45deg, #ff416c, #ff4b2b);
            color: white;
            border: none;
            padding: 12px 24px;
            border-radius: 50px;
            font-size: 1rem;
            font-weight: 700;
            cursor: pointer;
            box-shadow: 0 10px 25px rgba(255, 65, 108, 0.5);
            transition: all 0.3s ease;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .action-btn:hover {
            transform: translateY(-4px) scale(1.04);
            box-shadow: 0 15px 30px rgba(255, 65, 108, 0.7);
        }

        .action-btn.gift-btn {
            background: linear-gradient(45deg, #ffd700, #ff8800);
            color: #2e082d;
            box-shadow: 0 10px 25px rgba(255, 215, 0, 0.5);
            animation: giftGlow 2s infinite alternate;
        }

        .action-btn.wish-btn {
            background: linear-gradient(45deg, #e040fb, #00e5ff);
            color: #ffffff;
            box-shadow: 0 10px 25px rgba(224, 64, 251, 0.5);
        }

        .action-btn.back-btn {
            background: rgba(255, 255, 255, 0.15);
            border: 1px solid rgba(255, 255, 255, 0.3);
            color: #ffffff;
            box-shadow: 0 8px 20px rgba(0, 0, 0, 0.3);
        }

        .action-btn.back-btn:hover {
            background: rgba(255, 255, 255, 0.3);
            box-shadow: 0 12px 25px rgba(255, 255, 255, 0.4);
        }

        @keyframes giftGlow {
            0% { box-shadow: 0 0 15px rgba(255, 215, 0, 0.5); }
            100% { box-shadow: 0 0 30px rgba(255, 215, 0, 0.9); }
        }

        /* Modal Quà Bó Hoa 3D */
        .modal-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.85);
            backdrop-filter: blur(15px);
            z-index: 1000;
            display: flex;
            justify-content: center;
            align-items: center;
            opacity: 0;
            pointer-events: none;
            transition: all 0.5s ease;
        }

        .modal-overlay.active {
            opacity: 1;
            pointer-events: auto;
        }

        .modal-content {
            background: linear-gradient(135deg, rgba(255, 255, 255, 0.15), rgba(255, 255, 255, 0.05));
            border: 1px solid rgba(255, 255, 255, 0.3);
            border-radius: 30px;
            padding: 35px 25px;
            text-align: center;
            max-width: 500px;
            width: 90%;
            transform: scale(0.7) translateY(50px);
            transition: all 0.5s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            box-shadow: 0 30px 70px rgba(255, 105, 180, 0.4);
            position: relative;
        }

        .modal-overlay.active .modal-content {
            transform: scale(1) translateY(0);
        }

        .bouquet-img {
            width: 260px;
            max-width: 80%;
            height: auto;
            filter: drop-shadow(0 15px 25px rgba(255, 20, 147, 0.5));
            animation: floatBouquet 3s ease-in-out infinite alternate;
            margin-bottom: 20px;
        }

        @keyframes floatBouquet {
            0% { transform: translateY(0) rotate(0deg); }
            100% { transform: translateY(-15px) rotate(3deg); }
        }

        .bouquet-title {
            font-family: 'Dancing Script', cursive;
            font-size: 2.5rem;
            color: #ffd700;
            margin-bottom: 10px;
            text-shadow: 0 0 15px rgba(255, 215, 0, 0.6);
        }

        .bouquet-desc {
            font-size: 1.1rem;
            color: #fce4ec;
            line-height: 1.6;
            margin-bottom: 25px;
        }

        .close-btn {
            background: rgba(255, 255, 255, 0.2);
            border: 1px solid rgba(255, 255, 255, 0.4);
            color: white;
            padding: 10px 28px;
            border-radius: 50px;
            cursor: pointer;
            font-size: 1rem;
            font-weight: 600;
            transition: all 0.3s ease;
        }

        .close-btn:hover {
            background: rgba(255, 255, 255, 0.4);
            transform: scale(1.05);
        }

        @media (max-width: 520px) {
            .header-title { font-size: 2.6rem; }
            .recipient-name { font-size: 2.3rem; }
            .card-container { padding: 30px 20px; }
            .message-box { font-size: 1rem; padding: 16px; }
            .signature-text { font-size: 1.9rem; }
            .action-btn { padding: 10px 18px; font-size: 0.88rem; }
            .bouquet-img { width: 210px; }
        }
    </style>
</head>
<body>

    <canvas id="bgCanvas"></canvas>

    <!-- Nút Bật/Tắt Nhạc -->
    <div class="music-btn" id="musicBtn" onclick="toggleMusic()">🎵</div>

    <!-- Audio Nhạc Nền Piano Lãng Mạn -->
    <audio id="bgMusic" loop preload="auto">
        <source src="https://assets.mixkit.co/music/preview/mixkit-romantic-piano-wedding-483.mp3" type="audio/mpeg">
    </audio>

    <!-- Màn hình Phong thư 3D Mở đầu -->
    <div class="envelope-container" id="envelope" onclick="openCard()">
        <div class="envelope">
            <div class="envelope-flap"></div>
            <div class="seal">💌</div>
        </div>
        <div class="envelope-hint">Gửi Thảo... (Chạm để mở thiệp)</div>
    </div>

    <!-- Thiệp Chúc Mừng Chính -->
    <div class="card-container" id="card">
        <div class="badge-2010">20 / 10 / 2026</div>
        <div class="header-title">Happy Women's Day</div>
        <div class="recipient-name">✨ Thảo ✨</div>
        
        <div class="message-box">
            <span id="typedText"></span><span class="cursor" id="cursor"></span>
        </div>

        <!-- Chữ ký đặc biệt -->
        <div class="signature-section" id="signature">
            <div class="signature-text">Châm xinh ngoan iu thân gửi ❤️</div>
        </div>

        <div class="btn-group">
            <button class="action-btn back-btn" onclick="resetToEnvelope()">
                <span>↩ Quay lại</span>
            </button>
            <button class="action-btn gift-btn" onclick="openGift()">
                <span>🎁 Mở Quà</span>
            </button>
            <button class="action-btn wish-btn" onclick="triggerHeartBurstAndShootingStars()">
                <span>🌠 Sao Băng</span>
            </button>
        </div>
    </div>

    <!-- Popup Mở Quà Bó Hoa -->
    <div class="modal-overlay" id="giftModal">
        <div class="modal-content">
            <svg class="bouquet-img" viewBox="0 0 300 350" fill="none" xmlns="http://www.w3.org/2000/svg">
                <path d="M70 180 L150 330 L230 180 Z" fill="#ffb6c1" opacity="0.8"/>
                <path d="M50 160 L150 340 L250 160 Z" fill="#ff80ab" opacity="0.6"/>
                <path d="M110 260 L150 340 L190 260 Z" fill="#d81b60" opacity="0.9"/>
                <path d="M130 250 Q150 240 170 250 Q180 270 150 265 Q120 270 130 250 Z" fill="#ffd700"/>
                <circle cx="150" cy="255" r="8" fill="#ff6f00"/>

                <circle cx="150" cy="120" r="38" fill="#ff1744"/>
                <circle cx="150" cy="120" r="28" fill="#ff5252"/>
                <circle cx="150" cy="120" r="18" fill="#ff8a80"/>

                <circle cx="105" cy="110" r="32" fill="#d500f9"/>
                <circle cx="105" cy="110" r="22" fill="#e040fb"/>
                
                <circle cx="195" cy="110" r="32" fill="#ff2a6d"/>
                <circle cx="195" cy="110" r="22" fill="#ff7597"/>

                <circle cx="125" cy="70" r="30" fill="#ff4081"/>
                <circle cx="125" cy="70" r="20" fill="#ff80ab"/>

                <circle cx="175" cy="70" r="30" fill="#f50057"/>
                <circle cx="175" cy="70" r="20" fill="#ff4081"/>

                <circle cx="80" cy="150" r="28" fill="#ff1744"/>
                <circle cx="220" cy="150" r="28" fill="#d500f9"/>

                <circle cx="150" cy="170" r="32" fill="#ff5252"/>
                <circle cx="150" cy="170" r="20" fill="#ff8a80"/>

                <path d="M60 120 Q40 100 70 90 Z" fill="#00e676"/>
                <path d="M240 120 Q260 100 230 90 Z" fill="#00e676"/>
                <path d="M150 30 Q130 10 150 0 Q170 10 150 30 Z" fill="#76ff03"/>
                <circle cx="90" cy="60" r="3" fill="#fff" opacity="0.8"/>
                <circle cx="210" cy="50" r="4" fill="#ffd700" opacity="0.9"/>
                <circle cx="150" cy="40" r="3" fill="#fff" opacity="0.8"/>
            </svg>

            <div class="bouquet-title">Bó Hoa Tặng Thảo! 🌹</div>
            <div class="bouquet-desc">
                Mong rằng Thảo luôn tươi tắn, ngát hương và rực rỡ như những bông hoa xinh đẹp nhất này! ✨💐
            </div>
            <button class="close-btn" onclick="closeGift()">Cảm ơn Châm nha ❤️</button>
        </div>
    </div>

    <script>
        const message = `Chúc mừng Thảo nhân ngày Phụ nữ Việt Nam 20/10! 🌸\n\nChúc Thảo luôn rạng rỡ như những đóa hoa mùa xuân, lúc nào cũng giữ trọn nụ cười tươi tắn trên môi. Mong Thảo luôn bình an, gặp thật nhiều may mắn, đạt được mọi ước mơ và luôn được yêu thương, trân trọng mỗi ngày!\n\nCảm ơn Thảo vì đã luôn là một người vô cùng đặc biệt và tuyệt vời! ✨💖`;

        let isMusicPlaying = false;
        let typeTimeout = null;
        let index = 0;
        const music = document.getElementById('bgMusic');
        const musicBtn = document.getElementById('musicBtn');

        function toggleMusic() {
            if (isMusicPlaying) {
                music.pause();
                musicBtn.innerText = '🔇';
            } else {
                music.play().catch(() => {});
                musicBtn.innerText = '🎵';
            }
            isMusicPlaying = !isMusicPlaying;
        }

        function openCard() {
            document.getElementById('envelope').style.display = 'none';
            const card = document.getElementById('card');
            card.classList.add('active');

            music.play().then(() => {
                isMusicPlaying = true;
                musicBtn.innerText = '🎵';
            }).catch(() => {});

            // Reset và gõ lại từ đầu khi mở
            index = 0;
            document.getElementById('typedText').innerHTML = '';
            document.getElementById('signature').classList.remove('show');
            if (typeTimeout) clearTimeout(typeTimeout);
            
            typeTimeout = setTimeout(typeWriter, 400);
            triggerHeartBurstAndShootingStars();
        }

        // Hàm Quay lại trạng thái bao thư chưa mở
        function resetToEnvelope() {
            if (typeTimeout) clearTimeout(typeTimeout);
            
            const card = document.getElementById('card');
            card.classList.remove('active');

            setTimeout(() => {
                document.getElementById('envelope').style.display = 'block';
            }, 300);
        }

        function typeWriter() {
            if (index < message.length) {
                let char = message.charAt(index);
                if (char === '\n') {
                    document.getElementById('typedText').innerHTML += '<br>';
                } else {
                    document.getElementById('typedText').innerHTML += char;
                }
                index++;
                typeTimeout = setTimeout(typeWriter, 35);
            } else {
                document.getElementById('signature').classList.add('show');
            }
        }

        function openGift() {
            document.getElementById('giftModal').classList.add('active');
            triggerHeartBurstAndShootingStars();
        }

        function closeGift() {
            document.getElementById('giftModal').classList.remove('active');
        }

        /* --- Engine Canvas Hiệu ứng --- */
        const canvas = document.getElementById('bgCanvas');
        const ctx = canvas.getContext('2d');

        function resizeCanvas() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
        }
        resizeCanvas();
        window.addEventListener('resize', resizeCanvas);

        const particles = [];
        const heartBursts = [];
        const shootingStars = [];

        class FloatingParticle {
            constructor() { this.reset(); }

            reset() {
                this.x = Math.random() * canvas.width;
                this.y = -20;
                this.size = Math.random() * 10 + 6;
                this.speedY = Math.random() * 1.5 + 0.8;
                this.speedX = Math.random() * 1.2 - 0.6;
                this.opacity = Math.random() * 0.7 + 0.3;
                this.type = Math.random() > 0.4 ? 'petal' : 'glow';
                this.rotation = Math.random() * 360;
                this.rotSpeed = Math.random() * 2 - 1;
                this.color = ['#ffb6c1', '#ff69b4', '#ffd700', '#00e5ff'][Math.floor(Math.random() * 4)];
            }

            update() {
                this.y += this.speedY;
                this.x += Math.sin(this.y * 0.01) + this.speedX;
                this.rotation += this.rotSpeed;

                if (this.y > canvas.height + 20) { this.reset(); }
            }

            draw() {
                ctx.save();
                ctx.translate(this.x, this.y);
                ctx.rotate((this.rotation * Math.PI) / 180);
                ctx.globalAlpha = this.opacity;

                if (this.type === 'petal') {
                    ctx.fillStyle = this.color;
                    ctx.beginPath();
                    ctx.ellipse(0, 0, this.size / 2, this.size, 0, 0, Math.PI * 2);
                    ctx.fill();
                } else {
                    ctx.fillStyle = '#ffd700';
                    ctx.shadowBlur = 10;
                    ctx.shadowColor = '#ffd700';
                    ctx.beginPath();
                    ctx.arc(0, 0, this.size / 3, 0, Math.PI * 2);
                    ctx.fill();
                }
                ctx.restore();
            }
        }

        class HeartBurstParticle {
            constructor(x, y) {
                this.x = x;
                this.y = y;
                const angle = Math.random() * Math.PI * 2;
                const speed = Math.random() * 6 + 2;
                this.vx = Math.cos(angle) * speed;
                this.vy = Math.sin(angle) * speed;
                this.size = Math.random() * 18 + 12;
                this.alpha = 1;
                this.decay = Math.random() * 0.015 + 0.01;
                this.color = ['#ff2a6d', '#ff80ab', '#ffd700', '#e040fb', '#00ffff'][Math.floor(Math.random() * 5)];
            }

            update() {
                this.x += this.vx;
                this.y += this.vy;
                this.vx *= 0.98;
                this.vy *= 0.98;
                this.alpha -= this.decay;
            }

            draw() {
                ctx.save();
                ctx.globalAlpha = Math.max(0, this.alpha);
                ctx.fillStyle = this.color;
                ctx.font = `${this.size}px serif`;
                ctx.shadowBlur = 15;
                ctx.shadowColor = this.color;
                ctx.fillText('♥', this.x, this.y);
                ctx.restore();
            }
        }

        class ShootingStar {
            constructor() { this.reset(); }

            reset() {
                this.x = Math.random() * canvas.width * 1.5 - canvas.width * 0.2;
                this.y = -50;
                this.length = Math.random() * 120 + 80;
                this.speed = Math.random() * 10 + 12;
                this.size = Math.random() * 2 + 1;
                this.alpha = 1;
                this.active = true;
            }

            update() {
                this.x -= this.speed * 0.8;
                this.y += this.speed;
                if (this.y > canvas.height + 100 || this.x < -200) {
                    this.active = false;
                }
            }

            draw() {
                if (!this.active) return;
                ctx.save();
                ctx.globalAlpha = this.alpha;
                const gradient = ctx.createLinearGradient(
                    this.x, this.y,
                    this.x + this.length * 0.8, this.y - this.length
                );
                gradient.addColorStop(0, '#ffffff');
                gradient.addColorStop(0.3, '#ff80ab');
                gradient.addColorStop(1, 'transparent');

                ctx.strokeStyle = gradient;
                ctx.lineWidth = this.size;
                ctx.beginPath();
                ctx.moveTo(this.x, this.y);
                ctx.lineTo(this.x + this.length * 0.8, this.y - this.length);
                ctx.stroke();
                ctx.restore();
            }
        }

        for (let i = 0; i < 75; i++) { particles.push(new FloatingParticle()); }

        function triggerHeartBurstAndShootingStars() {
            const centerX = canvas.width / 2;
            const centerY = canvas.height / 2;

            for (let i = 0; i < 60; i++) {
                heartBursts.push(new HeartBurstParticle(centerX, centerY));
            }

            for (let i = 0; i < 8; i++) {
                setTimeout(() => {
                    shootingStars.push(new ShootingStar());
                }, i * 150);
            }
        }

        function animate() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);

            particles.forEach((p) => { p.update(); p.draw(); });

            for (let i = heartBursts.length - 1; i >= 0; i--) {
                heartBursts[i].update();
                heartBursts[i].draw();
                if (heartBursts[i].alpha <= 0) { heartBursts.splice(i, 1); }
            }

            for (let i = shootingStars.length - 1; i >= 0; i--) {
                shootingStars[i].update();
                shootingStars[i].draw();
                if (!shootingStars[i].active) { shootingStars.splice(i, 1); }
            }

            requestAnimationFrame(animate);
        }

        animate();
    </script>
</body>
